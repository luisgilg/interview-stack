global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: go-service
    metrics_path: /metrics
    static_configs:
      - targets: ['go-service:8081']

  - job_name: node-service
    metrics_path: /metrics
    static_configs:
      - targets: ['node-service:8082']

  - job_name: dotnet-service
    metrics_path: /metrics
    static_configs:
      - targets: ['dotnet-service:8083']
